name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Ensure OAUTH_KV namespace exists
        id: oauth_kv
        run: |
          # List existing KV namespaces and look for one titled "affinity-connector-OAUTH_KV"
          EXISTING_ID=$(npx wrangler kv namespace list 2>/dev/null \
            | jq -r '.[] | select(.title == "affinity-connector-OAUTH_KV") | .id // empty' 2>/dev/null || true)

          if [ -n "$EXISTING_ID" ]; then
            echo "OAUTH_KV namespace already exists: $EXISTING_ID"
            echo "namespace_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Creating OAUTH_KV namespace..."
            CREATE_OUTPUT=$(npx wrangler kv namespace create OAUTH_KV 2>&1) || true
            echo "$CREATE_OUTPUT"
            # Extract the namespace ID from output like: id = "abc123def456"
            NEW_ID=$(echo "$CREATE_OUTPUT" | sed -n 's/.*id = "\([^"]*\)".*/\1/p')
            if [ -z "$NEW_ID" ]; then
              echo "::error::Failed to create OAUTH_KV namespace. Output: $CREATE_OUTPUT"
              exit 1
            fi
            echo "Created OAUTH_KV namespace: $NEW_ID"
            echo "namespace_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Inject OAUTH_KV namespace ID into wrangler.toml
        run: sed -i 's/id = "OAUTH_KV_NAMESPACE_ID"/id = "${{ steps.oauth_kv.outputs.namespace_id }}"/' wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Affinity API key secret
        run: |
          if [ -n "$AFFINITY_API_KEY" ]; then
            printf '%s' "$AFFINITY_API_KEY" | npx wrangler versions secret put AFFINITY_API_KEY
          else
            echo "AFFINITY_API_KEY not set — skipping (OAuth handles per-user auth)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AFFINITY_API_KEY: ${{ secrets.AFFINITY_API_KEY }}

      - name: Set webhook secret
        run: printf '%s' "${{ secrets.AFFINITY_WEBHOOK_SECRET }}" | npx wrangler versions secret put AFFINITY_WEBHOOK_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Cloudflare Access AUD secret
        run: printf '%s' "${{ secrets.CLOUDFLARE_ACCESS_AUD }}" | npx wrangler versions secret put CLOUDFLARE_ACCESS_AUD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Ensure OAUTH_ENCRYPTION_KEY secret is set
        run: |
          if [ -n "$OAUTH_ENCRYPTION_KEY" ]; then
            echo "Setting OAUTH_ENCRYPTION_KEY from GitHub secret..."
            printf '%s' "$OAUTH_ENCRYPTION_KEY" | npx wrangler versions secret put OAUTH_ENCRYPTION_KEY
          else
            echo "OAUTH_ENCRYPTION_KEY not found in GitHub secrets — generating one..."
            NEW_KEY=$(openssl rand -hex 32)
            printf '%s' "$NEW_KEY" | npx wrangler versions secret put OAUTH_ENCRYPTION_KEY
            echo "::warning::A new OAUTH_ENCRYPTION_KEY was auto-generated. Add it to GitHub secrets to persist across deploys. Existing user tokens will be invalidated if this key changes."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
