name = "affinity-connector"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "affinity.trulock.com", custom_domain = true }
]

[vars]
AFFINITY_V1_BASE_URL = "https://api.affinity.co"
AFFINITY_V2_BASE_URL = "https://api.affinity.co/v2"
# Cloudflare Access JWT validation for /mcp (defense-in-depth).
# Set CLOUDFLARE_ACCESS_JWT_VALIDATION = true to enable Worker-level JWT verification.
# When enabled, every /mcp request must carry a valid Cf-Access-Jwt-Assertion header.
# CLOUDFLARE_ACCESS_AUD is a Cloudflare secret (set via wrangler secret put in CI).
# CLOUDFLARE_ACCESS_TEAM_DOMAIN: your Zero Trust team domain.
CLOUDFLARE_ACCESS_JWT_VALIDATION = false
CLOUDFLARE_ACCESS_TEAM_DOMAIN = "trulock.cloudflareaccess.com"

[[kv_namespaces]]
binding = "AFFINITY_CACHE"
id = "1413d1000c9a4911acae52b3ce49aaa8"

# OAuth 2.1 per-user authentication.
# The OAUTH_KV namespace ID is injected by CI (see .github/workflows/deploy.yml).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "OAUTH_KV_NAMESPACE_ID"

# Secrets (set via CI or wrangler secret put <NAME>)
# AFFINITY_API_KEY          — shared Affinity API key (optional when OAuth is enabled)
# OAUTH_ENCRYPTION_KEY      — 256-bit hex AES key for encrypting user API keys at rest
#                             Auto-generated by CI if not already set
